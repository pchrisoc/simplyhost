<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimplyHost Scripts</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 48rem; margin: 4rem auto; padding: 0 1.5rem; font: 1rem/1.6 system-ui, sans-serif; }
    h1 { line-height: 1.2; }
    ul { list-style: none; padding: 0; }
    li { margin: .75rem 0; }
    input[type="checkbox"] { width: 1.1rem; height: 1.1rem; vertical-align: middle; margin-right: .5rem; }
    .command-block { position: relative; background: #151922; color: #edf2fa; border-radius: .5rem; }
    pre { margin: 0; padding: 1.25rem 4rem 1.25rem 1.25rem; overflow-x: auto; }
    code { font-family: ui-monospace, monospace; font-size: .9rem; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .4; }
    #copy { position: absolute; top: .75rem; right: .75rem; display: grid; place-items: center; width: 2.5rem; height: 2.5rem; padding: 0; border: 1px solid #5b6575; border-radius: .35rem; background: #151922; color: #edf2fa; }
    #copy:hover:enabled { background: #303949; }
    button:focus-visible { outline: 2px solid #92c5ff; outline-offset: 2px; }
    #copy-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    a { color: light-dark(#1756a9, #92c5ff); text-underline-offset: .2em; }
    li a { font-family: ui-monospace, monospace; }
    footer { margin-top: 3rem; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>SimplyHost Scripts</h1>
    <p>Select scripts to add their run commands below. File links open the source.</p>
    <p>The list loads automatically from the repository’s main branch, including subfolders.</p>
    <div class="command-block">
      <pre><code id="commands"># Select a script below to get its run command.</code></pre>
      <button id="copy" type="button" aria-label="Copy commands" title="Copy commands" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/></svg>
      </button>
    </div>
    <span id="copy-status" role="status"></span>
    <h2>Available scripts</h2>
    <button id="refresh" type="button">Refresh</button>
    <p id="list-status" role="status">Loading scripts…</p>
    <ul id="scripts"></ul>
    <noscript><p>Enable JavaScript or browse the scripts using the GitHub link below.</p></noscript>
  </main>
  <footer><a href="https://github.com/pchrisoc/simplyhost/tree/main/scripts">View on GitHub</a></footer>
  <script>
    const repository = 'pchrisoc/simplyhost';
    const branch = 'main';
    const rawRoot = 'https://raw.githubusercontent.com/' + repository + '/' + branch + '/scripts/';
    const scriptsList = document.getElementById('scripts');
    const commands = document.getElementById('commands');
    const copyButton = document.getElementById('copy');
    const copyStatus = document.getElementById('copy-status');
    const listStatus = document.getElementById('list-status');
    const refreshButton = document.getElementById('refresh');
    const scriptExtensions = new Set(['sh', 'bash', 'zsh', 'fish', 'ps1', 'py', 'js', 'mjs', 'cjs', 'ts', 'rb', 'pl', 'php', 'lua', 'r', 'awk', 'bat', 'cmd', 'vbs', 'wsf', 'swift']);
    let scriptNames = [];
    let commandText = '';

    function encodedPath(path) {
      return path.split('/').map(segment => encodeURIComponent(segment).replace(/[!'()*]/g,
        character => '%' + character.charCodeAt(0).toString(16).toUpperCase())).join('/');
    }
    function extension(name) {
      return name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    }
    function isScript(entry) {
      if (entry.type !== 'blob' || !entry.path.startsWith('scripts/')) return false;
      const name = entry.path.slice('scripts/'.length);
      if (!name || name.split('/').some(segment => segment.startsWith('.'))) return false;
      return scriptExtensions.has(extension(name)) || entry.mode === '100755';
    }
    function runCommand(name) {
      const url = rawRoot + encodedPath(name);
      const ext = extension(name);
      const downloadName = 'simplyhost-script' + (/^[a-z0-9]+$/.test(ext) ? '.' + ext : '');
      if (ext === 'ps1') {
        return '# Run in PowerShell:\nInvoke-WebRequest -Uri ' + url + ' -OutFile ' + downloadName + '; & .\\' + downloadName;
      }
      if (ext === 'bat' || ext === 'cmd') {
        return '# Run in PowerShell:\nInvoke-WebRequest -Uri ' + url + ' -OutFile ' + downloadName + '; & .\\' + downloadName;
      }
      const shell = {sh: 'bash', bash: 'bash', zsh: 'zsh', fish: 'fish'}[ext];
      if (shell) return '# Run in ' + shell + ':\ncurl -fsSL ' + url + ' | ' + shell;
      const runtime = {py: 'python3', js: 'node', mjs: 'node', cjs: 'node', rb: 'ruby', pl: 'perl', php: 'php', lua: 'lua', r: 'Rscript', swift: 'swift'}[ext];
      const download = 'curl -fsSL ' + url + ' -o ' + downloadName;
      if (runtime) return '# Run in a Unix shell with ' + runtime + ':\n' + download + ' && ' + runtime + ' ' + downloadName;
      return '# Download and review; use the interpreter required by this script:\n' + download;
    }
    function updateCommands() {
      commandText = Array.from(scriptsList.querySelectorAll('input:checked'))
        .map(checkbox => runCommand(checkbox.dataset.scriptName)).join('\n\n');
      commands.textContent = commandText || '# Select a script below to get its run command.';
      copyButton.disabled = !commandText;
      copyStatus.textContent = '';
    }
    function renderScripts(names) {
      const selected = new Set(Array.from(scriptsList.querySelectorAll('input:checked'))
        .map(checkbox => checkbox.dataset.scriptName));
      const rows = names.map(name => {
        const row = document.createElement('li');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.scriptName = name;
        checkbox.setAttribute('aria-label', 'Select ' + name);
        checkbox.checked = selected.has(name);
        const link = document.createElement('a');
        link.href = rawRoot + encodedPath(name);
        link.textContent = name;
        row.append(checkbox, ' ', link);
        return row;
      });
      scriptsList.replaceChildren(...rows);
      updateCommands();
    }
    async function loadScripts() {
      refreshButton.disabled = true;
      listStatus.textContent = 'Loading scripts…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch('https://api.github.com/repos/' + repository + '/git/trees/' + branch + '?recursive=1',
          {cache: 'no-store', credentials: 'omit', signal: controller.signal});
        if (!response.ok) throw new Error('GitHub returned HTTP ' + response.status);
        const data = await response.json();
        if (data.truncated || !Array.isArray(data.tree)) throw new Error('GitHub returned an incomplete file list');
        scriptNames = data.tree.filter(isScript).map(entry => entry.path.slice('scripts/'.length)).sort();
        renderScripts(scriptNames);
        listStatus.textContent = scriptNames.length ? scriptNames.length + ' scripts available.' : 'No scripts found.';
      } catch (error) {
        listStatus.textContent = 'Could not refresh scripts. ' + (scriptNames.length ? 'The previous list is still shown. ' : '') +
          'Try Refresh or browse on GitHub. ' + (error.name === 'AbortError' ? 'The request timed out.' : error.message);
      } finally {
        clearTimeout(timeout);
        refreshButton.disabled = false;
      }
    }
    scriptsList.addEventListener('change', updateCommands);
    refreshButton.addEventListener('click', loadScripts);
    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(commandText);
        copyStatus.textContent = 'Copied!';
      } catch {
        copyStatus.textContent = 'Select and copy the commands above manually.';
      }
    });
    loadScripts();
  </script>
</body>
</html>
